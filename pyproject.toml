[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opc-web"
dynamic = ["version"]          # 单一来源：src/opc_web/__init__.py 的 __version__
description = "Local-first console for an AI employee team: assign a task, watch it run, review the report, keep the record — stdlib + zstandard only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wenbuer" }]
keywords = [
  "opc", "ai-agents", "multi-agent", "llm", "agents", "one-person-company",
  "local-first", "console", "knowledge-base", "deepseek", "dsh",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Code Generators",
]
# 运行时依赖只有一个：dsh 会话日志是 zstd 压缩的（读用量与进度心跳要解开它）。
# 其余全部标准库 —— 不装 zstandard 时 dsh 引擎仍能跑，只是拿不到用量与心跳追踪。
dependencies = ["zstandard>=0.21"]

[project.urls]
Homepage = "https://github.com/wenbuer/opc-web"
Repository = "https://github.com/wenbuer/opc-web"
Issues = "https://github.com/wenbuer/opc-web/issues"
Changelog = "https://github.com/wenbuer/opc-web/blob/main/CHANGELOG.md"

[project.scripts]
opc-web = "opc_web.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "opc_web.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
